name: Daily data update

on:
  workflow_dispatch:
  schedule:
    # Avoid the top-of-hour queue that can heavily delay scheduled workflows.
    # 19:13 and fallback 20:43 Asia/Taipei, Monday to Friday.
    - cron: "13 11 * * 1-5"
    - cron: "43 12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check whether today is already updated
        id: freshness
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          status_path = Path("data/update_status.json")
          today = datetime.now(ZoneInfo("Asia/Taipei")).date().isoformat()
          force_update = os.environ.get("FORCE_UPDATE", "").lower() == "true"
          last_success_date = ""
          if status_path.exists():
              try:
                  last_success_date = json.loads(status_path.read_text(encoding="utf-8")).get("last_success_date", "")
              except (OSError, json.JSONDecodeError):
                  pass

          should_run = force_update or last_success_date != today
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          print(f"Taipei date: {today}; last success: {last_success_date or 'none'}; should run: {should_run}")
          PY

      - name: Install dependencies
        if: steps.freshness.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Update ETF data
        if: steps.freshness.outputs.should_run == 'true'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: python update_data.py

      - name: Record successful update
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Taipei"))
          status = {
              "last_success_date": now.date().isoformat(),
              "last_success_at": now.isoformat(timespec="seconds"),
              "trigger": os.environ.get("GITHUB_EVENT_NAME", ""),
          }
          Path("data/update_status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit updated data
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update ETF data"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                echo "Data update pushed on attempt ${attempt}."
                break
              fi

              if [ "${attempt}" -eq 5 ]; then
                echo "::error::git push failed after ${attempt} attempts."
                exit 1
              fi

              delay=$((attempt * 20))
              echo "git push failed on attempt ${attempt}; retrying in ${delay}s."
              sleep "${delay}"
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Prepare static site
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          mkdir -p site
          cp index.html changes.html performance.html README.md site/
          cp -r data site/data
          touch site/.nojekyll

      - name: Configure Pages
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
